<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккордеон — О журнале</title>

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;
            padding: 24px 12px;
            color: #1a1a1a;
        }

        .accordion-article {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 12px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .accordion-article__item {
            border-bottom: 1px solid #e3e6ea;
        }
        .accordion-article__item:last-child {
            border-bottom: none;
        }

        .accordion-article__header {
            margin: 0;
        }

        .accordion-article__button {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 18px 8px;
            background: transparent;
            border: none;
            text-align: left;
            font-size: 18px;
            font-weight: 600;
            color: #1a3d6d;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .accordion-article__button:hover,
        .accordion-article__button:focus {
            color: #c8102e;
            outline: none;
        }

        /* Стрелка-индикатор */
        .accordion-article__button::after {
            content: "▾";
            font-size: 14px;
            color: #c8102e;
            transition: transform 0.3s ease;
            margin-left: 16px;
        }
        .accordion-article__button[aria-expanded="true"]::after {
            transform: rotate(180deg);
        }

        .accordion-article__body {
            padding: 4px 8px 24px 8px;
            color: #333333;
            line-height: 1.65;
            font-size: 15px;
        }

        .accordion-article__body p {
            margin: 0 0 12px;
        }
        .accordion-article__body p:last-child {
            margin-bottom: 0;
        }

        .accordion-article__body a {
            color: #c8102e;
            text-decoration: none;
            font-weight: 500;
        }
        .accordion-article__body a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="accordion-article" id="list-2243">

    <!-- 1. Цели и задачи -->
    <div class="accordion-article__item">
        <div class="accordion-article__header" id="header-2">
            <button class="accordion-article__button"
                    type="button"
                    data-toggle="collapse"
                    data-target="#collapse-2"
                    aria-expanded="false"
                    aria-controls="collapse-2">
                Цели и задачи
            </button>
        </div>
        <div id="collapse-2"
             class="accordion-article__content collapse"
             aria-labelledby="header-2"
             data-parent="#list-2243">
            <div class="accordion-article__body">
                <p>
                  Публикация научных статей в области трубопроводного транспорта нефти
                </p>
            </div>
        </div>
    </div>

    <!-- 2. Индексирование -->
    <div class="accordion-article__item">
        <div class="accordion-article__header" id="header-3">
            <button class="accordion-article__button"
                    type="button"
                    data-toggle="collapse"
                    data-target="#collapse-3"
                    aria-expanded="false"
                    aria-controls="collapse-3">
                Индексирование
            </button>
        </div>
        <div id="collapse-3"
             class="accordion-article__content collapse"
             aria-labelledby="header-3"
             data-parent="#list-2243">
            <div class="accordion-article__body">
                <p>
                    Редакция проводит непрерывную работу
                </p>
            </div>
        </div>
    </div>

    <!-- 3. Редакционный совет -->
    <div class="accordion-article__item">
        <div class="accordion-article__header" id="header-4">
            <button class="accordion-article__button"
                    type="button"
                    data-toggle="collapse"
                    data-target="#collapse-4"
                    aria-expanded="false"
                    aria-controls="collapse-4">
                Редакционный совет
            </button>
        </div>
        <div id="collapse-4"
             class="accordion-article__content collapse"
             aria-labelledby="header-4"
             data-parent="#list-2243">
            <div class="accordion-article__body">
            </div>
        </div>
    </div>

    <!-- 4. Редакционная этика -->
    <div class="accordion-article__item">
        <div class="accordion-article__header" id="header-5">
            <button class="accordion-article__button"
                    type="button"
                    data-toggle="collapse"
                    data-target="#collapse-5"
                    aria-expanded="false"
                    aria-controls="collapse-5">
                Редакционная этика
            </button>
        </div>
        <div id="collapse-5"
             class="accordion-article__content collapse"
             aria-labelledby="header-5"
             data-parent="#list-2243">
            <div class="accordion-article__body">
                <p>
                    В своей работе редакция журнала следует ...
                </p>
            </div>
        </div>
    </div>

    <!-- 5. Рецензирование -->
    <div class="accordion-article__item">
        <div class="accordion-article__header" id="header-6">
            <button class="accordion-article__button"
                    type="button"
                    data-toggle="collapse"
                    data-target="#collapse-6"
                    aria-expanded="false"
                    aria-controls="collapse-6">
                Рецензирование
            </button>
        </div>
        <div id="collapse-6"
             class="accordion-article__content collapse"
             aria-labelledby="header-6"
             data-parent="#list-2243">
            <div class="accordion-article__body">
                <p>
                    Редакция обеспечивает ....
                </p>
            </div>
        </div>
    </div>

    <!-- 6. Авторам -->
    <div class="accordion-article__item">
        <div class="accordion-article__header" id="header-7">
            <button class="accordion-article__button"
                    type="button"
                    data-toggle="collapse"
                    data-target="#collapse-7"
                    aria-expanded="false"
                    aria-controls="collapse-7">
                Авторам
            </button>
        </div>
        <div id="collapse-7"
             class="accordion-article__content collapse"
             aria-labelledby="header-7"
             data-parent="#list-2243">
            <div class="accordion-article__body">
                <p>
                    Редакционная политика основывается ...
                </p>
            </div>
        </div>
    </div>

</div>

<!-- jQuery + Bootstrap 4 JS (необходимы для collapse) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
