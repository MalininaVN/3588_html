<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты</title>
  <!-- Подключение Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Подключение Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    /* Фон контейнера */
    .bg-custom-blue {
      background-color: #5d9dce;
    }

    /* Убрали !important, используем форму .orange-input.form-control для приоритета */
    .orange-input.form-control {
      background-color: #f57e20;
      border: 1px solid #d66813;
      color: white;
      text-align: center;
      padding: 12px;
      resize: none; /* Запрет растягивания */
    }

    .orange-input.form-control::placeholder {
      color: #fff;
      opacity: 0.9;
    }

    /* Стиль кнопки */
    .btn-orange {
      background-color: #f57e20;
      border: 1px solid #d66813;
      color: white;
      width: 100%;
      padding: 12px;
    }
    .btn-orange:hover {
      background-color: #e06b15;
      color: white;
    }
  </style>
</head>
<body>

<!-- Утилита отступов p-4 (padding) со всех сторон на мобильных.p-md-5 увеличенный отступ на экранах пошире (планшеты/ПК)-->
<div class="container bg-custom-blue mt-5 p-4 p-md-5">
  <div class="row">
    <!-- Левая колонка (Контакты)-->
    <div class="col-md-4 text-white">
      <div class="mb-4">
        <h5 class="fw-bold mb-4">Контакты</h5>

        <p class="mb-1"><i class="bi bi-geo-alt me-2"></i><strong>Адрес:</strong></p>
        <p class="mb-4">г. Москва, Севастопольский пр., д. 47А</p>

        <p class="mb-1"><i class="bi bi-telephone me-2"></i><strong>Телефон:</strong></p>
        <p class="mb-4">+7(495)950-82-95</p>

        <p class="mb-1"><i class="bi bi-envelope me-2"></i><strong>Email:</strong></p>
        <p>MalininaVN@transneft.ru</p>
      </div>
    </div>

    <!-- Правая колонка (Форма) -->
    <div class="col-md-8">
      <form action="#" method="POST">
        <div class="mb-3">
          <label for="nameInput" class="visually-hidden">Имя</label>
          <input type="text" id="nameInput" name="name" class="form-control orange-input" placeholder="Имя" required>
        </div>

        <div class="mb-3">
          <label for="phoneInput" class="visually-hidden">Номер телефона</label>
          <input type="tel" id="phoneInput" name="phone" class="form-control orange-input" placeholder="Номер телефона" required>
        </div>

        <div class="mb-3">
          <label for="messageInput" class="visually-hidden">Текст</label>
          <textarea id="messageInput" name="message" class="form-control orange-input" placeholder="Текст" rows="4" required></textarea>
        </div>

        <button type="submit" class="btn btn-orange">Отправить</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
